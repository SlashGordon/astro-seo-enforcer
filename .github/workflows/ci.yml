name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Library checks — run across the Node versions the package supports.
  lib:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

  # End-to-end: build the demo site with the package wired in via `file:..`.
  # The demo uses Astro 7, which requires Node >= 22.12.
  demo:
    runs-on: ubuntu-latest
    needs: lib
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm install --prefix demo --no-audit --no-fund

      - run: npm run build --prefix demo
