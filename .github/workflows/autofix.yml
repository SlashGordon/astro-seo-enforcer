name: Autofix

on:
  pull_request:

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    # Forks hand this workflow a read-only token, so it can't push the fix
    # back; a fork contributor runs `npm run format` locally instead.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: apply prettier'
