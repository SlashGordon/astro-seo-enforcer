name: Autofix

# Runs on branch pushes rather than `pull_request` so it never hits the
# "workflow run required approval" gate that applies to fork / bot PRs —
# and it can only ever touch branches that live in this repo. Fork
# contributors run `npm run format` locally instead.
on:
  push:
    branches-ignore:
      - main
      - 'dependabot/**'

permissions:
  contents: write

jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format

      # No-op when nothing changed; the push it makes uses GITHUB_TOKEN,
      # which by design does not retrigger this workflow.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'style: apply prettier'
