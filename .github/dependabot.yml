version: 2
updates:
  # Library dependencies (root package.json)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - dependencies
    groups:
      # All update types (major included) so nothing lands as a lone PR.
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  # End-to-end demo site
  - package-ecosystem: npm
    directory: /demo
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - demo
    groups:
      demo-dependencies:
        patterns:
          - '*'

  # GitHub Actions used by the workflows
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - '*'
